
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤簿 管理者画面</title>
  <meta name="theme-color" content="#12283f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="出勤簿 管理者">
  <link rel="icon" type="image/png" href="./admin-icon.png">
  <link rel="apple-touch-icon" href="./admin-icon.png">
  <link rel="stylesheet" href="./schedule.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      text-align: center;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 2px 8px #00000010;
    }

    .status {
      color: #666;
      font-size: 14px;
    }

    .request {
      border-top: 1px solid #ddd;
      padding: 16px 0;
    }

    button {
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .refresh {
      background: #e8edf5;
      width: 100%;
    }

    .approve {
      background: #1677e8;
      color: white;
      width: 100%;
      margin-top: 12px;
    }
    
/* 折りたたみパネル */
.panel summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.panel summary::-webkit-details-marker {
  display: none;
}

.panel summary h2 {
  margin: 0;
}

.panel summary::after {
  content: "＋";
  color: #64748b;
  font-size: 22px;
}

.panel[open] summary::after {
  content: "－";
}

  [hidden] { display:none !important; }
input { display:block; width:100%; padding:14px; font-size:16px; border:1px solid #cbd5e1; border-radius:8px; margin:8px 0 18px; }
button:disabled { opacity:.55; cursor:wait; }
.status { overflow-wrap:anywhere; }
@media(max-width:480px) { body { padding:12px; } .panel { padding:16px; } h1 { font-size:22px; } }

.panel.compact { padding:0 14px; margin-top:10px; }
.panel.compact > summary { min-height:44px; padding:9px 0; }
.panel.compact > summary h2 { font-size:16px; line-height:1.4; font-weight:600; }
.panel.compact > summary::after { font-size:18px; }
.panel.compact[open] { padding-bottom:14px; }

select { max-width:100%; padding:10px; font-size:16px; border:1px solid #cbd5e1; border-radius:8px; background:white; }
.master-panel { padding:16px; margin-top:12px; }
.master-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
.master-heading h2 { font-size:19px; margin:0; }
.master-heading button { padding:10px 12px; font-size:14px; }
.master-primary { background:#1677e8; color:#fff; }
.company-switch { display:flex; background:#edf1f6; border-radius:9px; padding:3px; gap:3px; }
.company-switch button { flex:1; min-height:42px; padding:8px; font-size:15px; background:transparent; color:#475569; }
.company-switch button[aria-pressed="true"] { background:#fff; color:#0b5bb4; font-weight:bold; box-shadow:0 1px 4px #0002; }
.master-filters { display:grid; grid-template-columns:145px minmax(0,1fr) auto; gap:7px; margin-top:12px; }
.master-filters input { margin:0; min-width:0; padding:9px; }
.master-filters button { font-size:14px; padding:8px 10px; background:#e8edf5; }
#masterMessage { margin:10px 0; font-size:13px; }
.master-group-title { background:#f2f5f9; color:#475569; font-size:12px; margin:12px 0 0; padding:6px 8px; border-radius:4px; }
.master-row { display:flex; align-items:center; gap:8px; border-bottom:1px solid #edf0f4; padding:9px 0; }
.master-info { min-width:0; flex:1; }
.master-info strong { display:block; font-size:15px; line-height:1.4; overflow-wrap:anywhere; }
.master-info p { margin:3px 0 0; color:#64748b; font-size:12px; }
.master-badge { white-space:nowrap; font-size:11px; padding:4px 6px; border-radius:5px; background:#f1f5f9; color:#64748b; }
.master-badge.active { background:#e8f5ef; color:#166344; }
.master-badge.past { background:#fff5dd; color:#855a11; }
.master-badge.pending { background:#e7f1ff; color:#175b9f; }
.master-row .master-edit { flex:none; font-size:12px; min-width:40px; min-height:36px; padding:7px 5px; background:transparent; color:#64748b; margin:0; }
.master-row .master-edit:hover { background:#edf1f6; color:#175b9f; }
#masterEditor { display:grid; grid-template-columns:1fr 1fr; column-gap:10px; border:1px solid #b8d2ef; background:#f8fbff; padding:12px; border-radius:8px; margin:12px 0; }
#masterEditor > strong, #masterEditor .wide, #masterEditor > p { grid-column:1/-1; }
#masterEditor label { display:block; font-size:13px; margin:8px 0; }
#masterEditor select { display:block; width:100%; margin-top:5px; }
#masterEditor input { margin:5px 0; padding:10px; }
#masterEditor button { padding:10px; margin:0; font-size:14px; }
#masterEditor p { font-size:12px; }
#masterPending:empty { display:none; }
#masterPending { background:#f0f6ff; border-radius:6px; padding:9px; font-size:12px; }
.master-history { margin-top:14px; border-top:1px solid #e2e8f0; padding-top:10px; }
.master-history > summary { display:list-item; font-size:12px; color:#64748b; list-style:revert; }
.master-history > summary::after { content:"⌄"; font-size:14px; margin-left:6px; }
.master-history[open] > summary::after { content:"⌃"; }
.master-history .status { font-size:12px; }
@media(max-width:480px) { .master-filters { grid-template-columns:minmax(0,1fr) auto; } .master-filters input { grid-row:2; grid-column:1/-1; } .master-filters select { width:100%; } .master-panel { padding:14px; } }
</style>
</head>
<body><p id="bootMessage" class="status" role="status" style="text-align:center">ログイン状態を確認しています…</p>
<div id="loginScreen" class="container" hidden><h1>出勤簿 管理者画面</h1><section class="panel">
<h2>管理者ログイン</h2><form id="loginForm"><label for="loginEmail">メールアドレス</label><input id="loginEmail" type="email" autocomplete="username" required>
<label for="loginPassword">パスワード</label><input id="loginPassword" type="password" autocomplete="current-password" required><button type="submit" class="approve">ログイン</button></form>
<p id="loginMessage" class="status" role="status"></p></section></div>
  <div id="adminScreen" class="container" hidden>
    <h1>出勤簿 管理者画面</h1><p id="pageMessage" class="status" role="status" aria-live="polite"></p><button id="logoutButton" data-logout type="button" style="float:left;padding:10px 14px">ログアウト</button><div style="text-align:right"><button type="button" class="refresh" style="width:auto;padding:10px 16px" onclick="refreshAdmin()">↻ 更新</button></div>
<nav class="work-nav" aria-label="業務の切り替え"><button type="button" data-work-view="master" aria-pressed="true">現場マスター</button><button type="button" data-work-view="schedule" aria-pressed="false">工程表マスター</button></nav>
<section class="panel" id="schedulePanel" hidden></section>
<section class="panel master-panel" id="masterPanel" aria-labelledby="masterTitle">
  <div class="master-heading"><h2 id="masterTitle">現場マスター</h2><button id="masterAdd" class="master-primary" type="button">＋ 現場を追加</button></div>
  <div id="masterCompany" class="company-switch" role="group" aria-label="表示する会社">
    <button type="button" data-company="菊永建設" aria-pressed="true">菊永建設</button>
    <button type="button" data-company="アールシー" aria-pressed="false">アールシー</button>
  </div>
  <div class="master-filters"><select id="masterYear" aria-label="表示する年度"></select><label><input id="masterFinished" type="checkbox">終了した現場を表示</label><button id="masterRefresh" type="button" aria-label="現場一覧を更新">↻ 更新</button></div>
  <p id="masterMessage" class="status" role="status" aria-live="polite">現場を読み込みます…</p>
  <form id="masterEditor" hidden>
    <strong id="masterEditorTitle">現場を追加</strong>
    <label>年度<select id="editYear" required></select></label>
    <label>会社<select id="editCompany" required><option>菊永建設</option><option>アールシー</option></select></label>
    <label>工事種別<select id="editType" required><option>公共</option><option>民間</option></select></label>
    <label>区分<select id="editCategory"><option>通常</option><option>小規模</option></select></label>
    <label class="wide">現場名<input id="editName" required maxlength="100" autocomplete="off"><button id="masterRename" type="button">工事名を変更する</button></label>
    <label class="wide">アプリでの表示<select id="editStatus"><option value="○">○ 通常の現場一覧</option><option value="△">△ 過去の現場</option><option value="×">× 一覧に表示しない</option><option value="">終了</option></select></label>
    <p id="editCode" class="status">工事番号はExcelで自動採番します。</p>
    <button type="submit" class="approve">変更を依頼する</button> <button id="masterCancel" type="button">閉じる</button>
  </form>
  <div id="masterPending" class="status" aria-live="polite"></div>
  <div id="masterList"></div>
  <details id="masterHistory" class="master-history"><summary>変更履歴 <span id="masterChangeCount"></span></summary><div id="masterChanges"></div></details>
</section>
    <details class="panel compact">
      <summary><h2>Excelへの反映状況</h2></summary>
      <p class="status">出勤・修正の記録が、会社のExcelへ転記されるのを待っている件数です。</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;background:#fff4df;padding:16px;border-radius:10px">出勤の反映待ち<br><strong id="syncPending" style="font-size:28px">—</strong></div>
        <div style="flex:1;background:#e7f1ff;padding:16px;border-radius:10px">修正の反映待ち<br><strong id="syncEdits" style="font-size:28px">—</strong></div>
      </div>
      <p id="syncSummaryMessage" class="status" role="status">管理者認証を確認中...</p>
      <p id="syncCheckedAt" class="status"></p>
      <button id="syncRefreshButton" class="refresh" type="button" onclick="loadSyncSummary()">反映状況を更新</button>
    </details>

    <details class="panel compact">
  <summary>
    <h2>端末登録申請</h2>
  </summary>
      <p class="status" id="status">
  管理者認証を確認中...
</p>
<p class="status" id="adminStatus"></p>

     <button class="refresh" type="button" onclick="loadRequests()">
  申請一覧を更新
</button>

<button
  id="approveAllButton"
  class="approve"
  type="button"
  style="display:none; margin:12px 0;"
  onclick="approveAllRequests()">
  まとめて承認
</button>

<div id="requestList">
        <p class="status">
          接続設定後、ここに承認待ちの申請を表示します。
        </p>
      </div>
      </details>

  <details class="panel compact">
    <summary>
      <h2>端末管理一覧</h2>
    </summary>

<button class="refresh" type="button" onclick="loadApprovedDevices()">
  一覧を更新
</button>

<button
  id="toggleDeviceHistoryButton"
  type="button"
  onclick="toggleDeviceHistory()"
  style="width:100%; margin-top:10px; background:#64748b; color:white;">
  すべて表示（無効化済みを含む）
</button>

    <div id="approvedDeviceList">
      <p class="status">「一覧を更新」を押してください。</p>
    </div>
  </details>

</div>
<script type="module">
import('./app.js').catch(() => {
 const status = document.getElementById('bootMessage');
 status.hidden = false; status.textContent = '画面を読み込めませんでした。通信と公開ファイルを確認して再読み込みしてください。';
});
</script><noscript>この画面を使用するにはJavaScriptを有効にしてください。</noscript></body></html>
